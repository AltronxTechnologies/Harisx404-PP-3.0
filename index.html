<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Harisx404 project workspace" />
    <title>Harisx404 | Workspace Ready</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0a0e14;
        color: #f4f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #0a0e14;
      }

      main {
        width: min(1120px, calc(100% - 40px));
        min-height: 100vh;
        margin: 0 auto;
        display: grid;
        align-content: center;
        gap: 64px;
        padding: 72px 0;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 18px;
        color: #8ea0b8;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .pulse {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #42d392;
        box-shadow: 0 0 0 5px rgba(66, 211, 146, 0.12);
      }

      h1 {
        max-width: 780px;
        margin: 0;
        font-size: clamp(3.4rem, 8vw, 7.4rem);
        line-height: 0.93;
        letter-spacing: -0.065em;
      }

      .accent {
        color: #42d392;
      }

      .intro {
        max-width: 650px;
        margin: 28px 0 0;
        color: #aab7c8;
        font-size: clamp(1rem, 2vw, 1.25rem);
        line-height: 1.65;
      }

      .details {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border-top: 1px solid #273141;
        border-bottom: 1px solid #273141;
      }

      .detail {
        min-height: 150px;
        padding: 28px 28px 28px 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 24px;
      }

      .detail + .detail {
        padding-left: 28px;
        border-left: 1px solid #273141;
      }

      .label {
        color: #65758b;
        font-size: 0.74rem;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .value {
        margin: 0;
        color: #e7edf5;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        font-size: 0.95rem;
      }

      @media (max-width: 680px) {
        main {
          width: min(100% - 32px, 1120px);
          gap: 44px;
          padding: 48px 0;
        }

        h1 {
          font-size: clamp(3rem, 18vw, 5rem);
        }

        .details {
          grid-template-columns: 1fr;
        }

        .detail {
          min-height: auto;
          padding: 22px 0;
        }

        .detail + .detail {
          padding-left: 0;
          border-top: 1px solid #273141;
          border-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section aria-labelledby="page-title">
        <p class="eyebrow"><span class="pulse" aria-hidden="true"></span>Alloy environment online</p>
        <h1 id="page-title">Build from a <span class="accent">clean slate.</span></h1>
        <p class="intro">
          The Harisx404 workspace is containerized and ready for development. This repository began empty; this page confirms its Alloy runtime is healthy and reachable.
        </p>
      </section>

      <section class="details" aria-label="Environment details">
        <article class="detail">
          <span class="label">Runtime</span>
          <p class="value">nginx / alpine</p>
        </article>
        <article class="detail">
          <span class="label">Frontend</span>
          <p class="value">localhost:3000</p>
        </article>
        <article class="detail">
          <span class="label">Status</span>
          <p class="value">ready for iteration</p>
        </article>
      </section>
    </main>
  </body>
</html>
