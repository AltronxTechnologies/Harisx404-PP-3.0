services:
  web:
    image: node:22-bookworm
    working_dir: /workspace
    network_mode: host
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/node_modules
      - web_next_cache:/workspace/.next
    environment:
      IS_ALLOY: ${IS_ALLOY:-false}
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
    command: bash -lc "bash .alloy/populate-env.sh && set -a && . ./.env.local && set +a && npm ci --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0 --port 3000"
    restart: unless-stopped

volumes:
  web_node_modules:
  web_next_cache:
