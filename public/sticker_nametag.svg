<svg xmlns="http://www.w3.org/2000/svg" width="236" height="164" viewBox="0 0 236 164">
  <defs>
    <linearGradient id="ntTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="ntBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f2f6"/>
    </linearGradient>
  </defs>
  <g transform="rotate(3 118 82)">
    <!-- die-cut white border -->
    <rect x="10" y="12" width="216" height="140" rx="18" fill="#ffffff" stroke="#000000" stroke-opacity="0.08" stroke-width="1.5"/>
    <!-- header band -->
    <path d="M18 32 a12 12 0 0 1 12 -12 h176 a12 12 0 0 1 12 12 v30 H18 Z" fill="url(#ntTop)"/>
    <text x="118" y="42" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" letter-spacing="3" fill="#ffffff" text-anchor="middle">HELLO</text>
    <text x="118" y="56" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.8" fill="#e0e7ff" text-anchor="middle">MY HANDLE IS</text>
    <!-- body -->
    <path d="M18 62 h200 v66 a12 12 0 0 1 -12 12 H30 a12 12 0 0 1 -12 -12 Z" fill="url(#ntBody)"/>
    <!-- handle, hand-written feel -->
    <text x="118" y="106" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="27" font-weight="500" fill="#1e1b4b" text-anchor="middle">@harisx404</text>
    <!-- ink underline -->
    <path d="M56 118 C 90 124, 150 112, 180 118" fill="none" stroke="#6366f1" stroke-width="2.4" stroke-linecap="round" opacity="0.85"/>
    <text x="118" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.6" fill="#7d8296" text-anchor="middle">SAME NAME · EVERY PLATFORM</text>
  </g>
</svg>
