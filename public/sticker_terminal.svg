<svg xmlns="http://www.w3.org/2000/svg" width="232" height="168" viewBox="0 0 232 168">
  <defs>
    <linearGradient id="t3Head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#272c3a"/>
      <stop offset="1" stop-color="#1a1e2a"/>
    </linearGradient>
    <linearGradient id="t3Body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111420"/>
      <stop offset="1" stop-color="#0a0c14"/>
    </linearGradient>
    <radialGradient id="t3Glow" cx="0.28" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="rotate(-3 116 84)">
    <!-- die-cut white border -->
    <rect x="10" y="12" width="212" height="140" rx="19" fill="#ffffff" stroke="#000000" stroke-opacity="0.08" stroke-width="1.5"/>
    <!-- window -->
    <rect x="18" y="20" width="196" height="124" rx="12" fill="url(#t3Body)" stroke="#2c3242" stroke-width="1.5"/>
    <path d="M18 32 a12 12 0 0 1 12 -12 h172 a12 12 0 0 1 12 12 v16 H18 Z" fill="url(#t3Head)"/>
    <line x1="18" y1="48" x2="214" y2="48" stroke="#000000" stroke-opacity="0.35"/>
    <circle cx="35" cy="34" r="4.5" fill="#ff5f57"/>
    <circle cx="51" cy="34" r="4.5" fill="#febc2e"/>
    <circle cx="67" cy="34" r="4.5" fill="#28c840"/>
    <text x="116" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#8b93a5" text-anchor="middle">~ / late-night session</text>
    <rect x="18" y="48" width="196" height="96" fill="url(#t3Glow)"/>
    <!-- prompt -->
    <text x="32" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <tspan fill="#818cf8">~</tspan><tspan fill="#34d399" dx="6">❯</tspan><tspan fill="#e6edf3" dx="8">whoami</tspan>
    </text>
    <text x="32" y="93" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#a5b4fc" font-style="italic">curiosity, compiled</text>
    <text x="32" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <tspan fill="#818cf8">~</tspan><tspan fill="#34d399" dx="6">❯</tspan>
    </text>
    <rect x="64" y="106" width="7.5" height="12.5" fill="#a5b4fc">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.3s" repeatCount="indefinite"/>
    </rect>
    <text x="32" y="135" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1" fill="#6b7488"># the cursor never sleeps</text>
  </g>
</svg>
