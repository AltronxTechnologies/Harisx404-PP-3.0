project:
  name: visionshield-ai
  status: PLANNED
  environment: warehouse_fixed_camera

classes:
  0: person
  1: forklift
  2: hardhat
  3: high_visibility_vest

dataset:
  roboflow_workspace: NEEDS_APPROVAL
  roboflow_project: NEEDS_APPROVAL
  raw_version: NEEDS_APPROVAL
  augmented_version: NEEDS_APPROVAL
  split_manifest: data/manifests/splits.json
  image_size: 640

training:
  framework: ultralytics
  version: 8.3.0
  model: yolo11n.pt
  epochs: 100
  patience: 20
  batch: NEEDS_HARDWARE_TEST
  seed: 42
  device: REQUIRED_PER_RUN
  online_augmentation: DISABLED_FOR_E1_E2_ABLATION

inference:
  confidence: NEEDS_VALIDATION_SELECTION
  iou: NEEDS_VALIDATION_SELECTION
  max_detections: 300

tracking:
  tracker: bytetrack
  config: NEEDS_VALIDATION_SELECTION

governance:
  human_review_required: true
  facial_recognition: false
  cross_camera_identity: false
  intent_inference: false
