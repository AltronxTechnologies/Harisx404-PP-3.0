name: VisionShield CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: make lint
      - run: make format-check
      - run: make typecheck
      - run: make test
      - run: make smoke

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file Dockerfile.dev --tag visionshield-dev:test .
      - run: docker run --rm visionshield-dev:test
